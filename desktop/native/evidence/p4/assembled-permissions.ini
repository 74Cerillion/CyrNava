[Application]
name=io.github._74Cerillion.CyrNava
runtime=org.kde.Platform/x86_64/6.11
sdk=org.kde.Sdk/x86_64/6.11
base=app/io.qt.PySide.BaseApp/x86_64/6.11
command=cyrnava

[Context]
shared=!network;
sockets=wayland;
devices=dri;
filesystems=!home;xdg-config/kdeglobals:ro;!host;

[Session Bus Policy]
com.canonical.AppMenu.Registrar=talk
org.kde.kconfig.notify=talk
org.kde.KGlobalSettings=talk

[Environment]
QT_QPA_PLATFORM=wayland
QT_QPA_PLATFORMTHEME=xdgdesktopportal
QTWEBENGINE_DICTIONARIES_PATH=/app/qtwebengine_dictionaries
QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
