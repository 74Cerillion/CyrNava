name: CyrNava CI

on:
  push:
    branches: [desktop/p2-production-integration, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyrnava-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked workflow parser
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
      - name: Validate workflow and negative contracts
        run: |
          python ci/validate.py
          python -m unittest discover -s ci -p 'test_ci.py' -v
          python ci/bootstrap.py "$RUNNER_TEMP/ci-tools"
          "$RUNNER_TEMP/ci-tools/actionlint" -color .github/workflows/ci.yml

  backend:
    name: Backend and security
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/package.json
            .nvmrc
      - name: Install verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak ostree
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --only-binary=:all: -r backend/requirements.txt
          backend/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
          backend/.venv/bin/python -m pip check
          npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund
      - name: Backend, security, lifecycle and migration regressions
        run: python ci/verify.py backend --require-clean-frontend
      - name: Preserve synthetic test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-output/backend*
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: Frontend and browser
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/ci-output/browser-junit.xml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/package.json
            .nvmrc
      - name: Install locked frontend and browser dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --only-binary=:all: -r backend/requirements.txt
          backend/.venv/bin/python -m pip check
          npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
          cd frontend
          npx --no-install playwright install --with-deps chromium
      - name: Lint, unit tests, TypeScript, production build and Chromium tests
        run: python ci/verify.py frontend
      - name: Preserve synthetic browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ci-output/frontend.json
            ci-output/browser-junit.xml
            frontend/test-results/
          retention-days: 7
          if-no-files-found: error

  native:
    name: Native Ubuntu source installation and update
    needs: [backend, frontend]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/package.json
            .nvmrc
      - name: Verify immutable source and install native source prerequisites
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain)"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3.14-venv build-essential desktop-file-utils apparmor libglib2.0-bin libnss3 libnspr4 libasound2t64 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libfontconfig1
          npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund
      - name: Native installer, security and transaction regressions
        run: |
          /usr/bin/python3.14 -B -m unittest discover -s packaging/native -p 'test_*.py' -v
          /usr/bin/python3.14 -B -m unittest discover -s packaging/native/feasibility -p 'test_*.py' -v
      - name: Verify clean no-Git source installation and data-preserving online update
        run: /usr/bin/python3.14 -B ci/native_source.py --output ci-output/native-source
      - name: Preserve safe source-install diagnostics without binary payloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-install-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-output/native-source/artifacts/*.json
          retention-days: 7
          if-no-files-found: error

  required:
    name: CI required
    if: always()
    needs: [validate, backend, frontend, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      VALIDATE_RESULT: ${{ needs.validate.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      NATIVE_RESULT: ${{ needs.native.result }}
    steps:
      - name: Require every verification and artifact job to succeed
        run: |
          for result in "$VALIDATE_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT" "$NATIVE_RESULT"; do
            test "$result" = success || exit 1
          done
