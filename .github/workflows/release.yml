name: CyrNava P5B staging rehearsal

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full owner-approved source commit SHA
        required: true
        type: string
      ci_run_id:
        description: Successful approved P5A CI run
        required: true
        type: string
      version:
        description: Approved existing application version
        required: true
        type: string
      channel:
        description: Production publication is disabled
        required: true
        type: choice
        options: [staging]
      authorization_ref:
        description: Reviewed disposable-staging authorization reference
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cyrnava-p5b-staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  RELEASE_SOURCE: ${{ inputs.source_commit }}
  RELEASE_CI_RUN: ${{ inputs.ci_run_id }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_AUTHORIZATION: ${{ inputs.authorization_ref }}

jobs:
  eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify release policy and configured independent approval protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.lock
          python ci/release/workflow_policy.py
          python ci/release/preflight.py
  staging:
    needs: eligibility
    environment: p5b-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install public verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak ostree gnupg
      - name: Recheck eligibility, create disposable key and verify signed staging repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python ci/release/stage.py --live --source-commit "$RELEASE_SOURCE" --ci-run-id "$RELEASE_CI_RUN" --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" --authorization-ref "$RELEASE_AUTHORIZATION" --output "$RUNNER_TEMP/cyrnava-p5b"
      - name: Retain safe status only; no key homes, repositories or packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p5b-staging-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cyrnava-p5b/result.json
            ${{ runner.temp }}/cyrnava-p5b/eligibility.json
          retention-days: 7
          if-no-files-found: error
